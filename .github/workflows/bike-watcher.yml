name: Watch Bike-Discount

# Schedule and manual runs only. Push is intentionally omitted so the
# products.json commit below cannot start another run.
on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: Send one Telegram test message and skip the catalogue scrape
        type: boolean
        default: false
    schedule:
      - cron: "50 * * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send Telegram test message
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_message == true
        run: python watcher.py --test-telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run watcher
        if: github.event_name != 'workflow_dispatch' || inputs.send_test_message != true
        run: python watcher.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit product state when it changed
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.send_test_message != true)
        run: |
          if [ ! -f data/products.json ]; then
            echo "No product state file to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          if git diff --cached --quiet; then
            echo "No product state change to commit"
          else
            git commit -m "Update Bike-Discount product state"
            git push
          fi
